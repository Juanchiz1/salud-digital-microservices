server:
  port: 8080

spring:
  application:
    name: hce-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saluddigital_hce}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

laboratorio:
  url: ${LAB_URL:http://localhost:8081}
  envio:
    intervalo-ms: 10000        

seguridad:
  jwt:
    secreto: ${JWT_SECRET}    

indicadores:
  umbral-minimo: ${INDICADORES_UMBRAL:5}   

integracion:
  nombre: hce-service
  par: lab-service
  secreto: ${INTEGRACION_SECRET}  

cors:
  origenes: ${CORS_ORIGENES:http://127.0.0.1:5500,http://localhost:5500}   