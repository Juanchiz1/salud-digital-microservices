server:
  port: 8080

spring:
  application:
    name: hce-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saluddigital_hce}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

laboratorio:
  url: ${LAB_URL:http://localhost:8081}
  envio:
    intervalo-ms: 10000        

seguridad:
  jwt:
    secreto: ${JWT_SECRET}    