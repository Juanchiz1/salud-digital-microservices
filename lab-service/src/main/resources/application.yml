server:
  port: 8081

spring:
  application:
    name: lab-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saluddigital_lab}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health